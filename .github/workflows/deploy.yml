name: Deploy to VPS

on:
  push:
    branches: [main, master, development]
  workflow_dispatch:

concurrency:
  group: skoolcein
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, nawasena, production]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # .env stored at ~/apps/skoolcein/.env on the runner host, never committed to git
      - name: Inject .env
        run: cp $HOME/apps/skoolcein/.env .env

      - name: Build images
        run: docker compose build

      - name: Run DB migrations
        run: |
          set -x
          # Only packages/backend owns a drizzle-kit migration surface now —
          # Ponder self-manages its own onchain tables (schema `skoolcein`)
          # internally via its build-id/crash-recovery engine, no drizzle-kit
          # involved. Backend migrates its own database (DATABASE_URL — see
          # root .env.example section 3) before either container starts
          # serving traffic. `docker compose run` already resolves this from
          # .env via the service's own environment block, no manual export needed.
          docker compose run --rm --no-deps \
            scholarship-backend \
            sh -c 'if [ -d drizzle ] && [ "$(ls -A drizzle)" ]; then bun run db:migrate || true; else bun run db:push -- --force || true; fi'

      - name: Deploy containers
        run: docker compose up -d --remove-orphans

      - name: Show running containers
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Prune old images
        run: docker image prune -f
