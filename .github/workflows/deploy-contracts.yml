name: Deploy Contracts

on:
  # Run manually so contract deployment is deliberate and not triggered by every push.
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to"
        required: true
        default: "nawasena"
        type: choice
        options:
          - nawasena
          - liskSepolia
      verify:
        description: "Verify contracts on Blockscout after deployment (Lisk only)"
        required: false
        default: "true"
        type: boolean

# Only one contract deployment at a time to avoid nonce/race issues.
concurrency:
  group: skoolcein-contracts
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy v4 Contracts (${{ inputs.network }})
    runs-on: [self-hosted, nawasena, production]
    timeout-minutes: 30

    env:
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      CHAIN_ID: ${{ inputs.network == 'liskSepolia' && '4202' || '31338' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install contract dependencies
        working-directory: packages/contract
        run: bun install

      - name: Compile contracts
        working-directory: packages/contract
        run: bun hardhat compile

      - name: Deploy v4 to ${{ inputs.network }}
        working-directory: packages/contract
        env:
          HARDHAT_IGNITION_CONFIRM_DEPLOYMENT: "false"
          HARDHAT_IGNITION_CONFIRM_RESET: "false"
        run: |
          bun hardhat ignition deploy \
            ignition/modules/scholarship-v4.ts \
            --network ${{ inputs.network }} \
            ${{ inputs.network == 'liskSepolia' && inputs.verify && '--verify' || '' }}

      - name: Sync deployments to frontend / indexer
        working-directory: packages/contract
        run: bun scripts/sync-deployments.ts ${{ env.CHAIN_ID }}

      - name: Update runner .env with new contract addresses
        run: |
          ENV_FILE="$HOME/apps/skoolcein/.env"
          mkdir -p "$(dirname "$ENV_FILE")"
          touch "$ENV_FILE"

          # Extract addresses from the auto-generated contractsV4.ts into the root env file.
          # This keeps docker-compose and the app deploy workflow in sync.
          for key in CONTRACT_CORE CONTRACT_TREASURY CONTRACT_BOUNTY CONTRACT_REPUTATION CONTRACT_COMMITTEE CONTRACT_MILESTONE_MANAGER; do
            sed -i "/^${key}=/d" "$ENV_FILE"
          done

          cat >> "$ENV_FILE" <<'EOF'

          # Auto-generated by deploy-contracts.yml
          EOF
          grep -E 'ScholarshipCore|ScholarshipTreasury|ScholarshipBounty|ScholarshipReputation|CommitteeGovernance|MilestoneManager' \
            packages/frontend/src/constants/contractsV4.ts | \
          sed -E 's/ *ScholarshipCore: "(0x[0-9a-fA-F]+)".*/CONTRACT_CORE="\1"/; s/ *ScholarshipTreasury: "(0x[0-9a-fA-F]+)".*/CONTRACT_TREASURY="\1"/; s/ *ScholarshipBounty: "(0x[0-9a-fA-F]+)".*/CONTRACT_BOUNTY="\1"/; s/ *ScholarshipReputation: "(0x[0-9a-fA-F]+)".*/CONTRACT_REPUTATION="\1"/; s/ *CommitteeGovernance: "(0x[0-9a-fA-F]+)".*/CONTRACT_COMMITTEE="\1"/; s/ *MilestoneManager: "(0x[0-9a-fA-F]+)".*/CONTRACT_MILESTONE_MANAGER="\1"/' | \
          grep '^CONTRACT_' >> "$ENV_FILE"

          echo "Updated $ENV_FILE"

      - name: Commit synced addresses and ABIs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/src/constants/contractsV4.ts
          git add packages/ponder/abis/v4/
          if git diff --cached --quiet; then
            echo "No address/ABI changes to commit"
          else
            git commit -m "chore(contracts): sync ${{ inputs.network }} deployment addresses and ABIs"
            git push
          fi

      - name: Dump logs on failure
        if: failure()
        working-directory: packages/contract
        run: cat ignition/deployments/chain-${{ env.CHAIN_ID }}/journal.json 2>/dev/null || true
