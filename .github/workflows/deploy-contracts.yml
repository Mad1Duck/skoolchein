name: Deploy Contracts

on:
  # Run manually so contract deployment is deliberate and not triggered by every push.
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to"
        required: true
        default: "nawasena"
        type: choice
        options:
          - nawasena
          - liskSepolia
      verify:
        description: "Verify contracts on Blockscout after deployment (Lisk only)"
        required: false
        default: "true"
        type: boolean

# Only one contract deployment at a time to avoid nonce/race issues.
concurrency:
  group: skoolcein-contracts
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy v4 Contracts (${{ inputs.network }})
    runs-on: [self-hosted, nawasena, production]
    timeout-minutes: 30

    env:
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      CHAIN_ID: ${{ inputs.network == 'liskSepolia' && '4202' || '31338' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install contract dependencies
        working-directory: packages/contract
        run: bun install

      - name: Compile contracts
        working-directory: packages/contract
        run: bun hardhat compile

      - name: Deploy v4 to ${{ inputs.network }}
        working-directory: packages/contract
        env:
          HARDHAT_IGNITION_CONFIRM_DEPLOYMENT: "false"
          HARDHAT_IGNITION_CONFIRM_RESET: "false"
        run: |
          bun hardhat ignition deploy \
            ignition/modules/scholarship-v4.ts \
            --network ${{ inputs.network }} \
            ${{ inputs.network == 'liskSepolia' && inputs.verify && '--verify' || '' }}

      - name: Sync deployments to frontend / indexer
        working-directory: packages/contract
        run: bun scripts/sync-deployments.ts ${{ env.CHAIN_ID }}

      - name: Update runner .env with new contract addresses
        run: |
          ENV_FILE="$HOME/apps/skoolcein/.env"
          mkdir -p "$(dirname "$ENV_FILE")"
          touch "$ENV_FILE"

          # sync-deployments.ts (previous step) writes .deployments.env containing
          # EVERY deployed address plus START_BLOCK, derived from its own
          # ENV_KEY_MAP. Consume that instead of re-deriving the list here — the
          # old hardcoded 6-contract grep silently skipped anything newer
          # (ScholarshipAdmin, MockUSDC, FraudNFT, ScholarshipPriceOracle), and a
          # missing CONTRACT_* reaches the runner unset, which fails the indexer
          # at startup rather than degrading.
          if [ ! -f .deployments.env ]; then
            echo "::error::.deployments.env not produced by sync-deployments.ts"
            exit 1
          fi

          # Replace the whole managed block: drop every existing CONTRACT_* and
          # START_BLOCK line, then append the freshly deployed set.
          sed -i -E '/^CONTRACT_[A-Z_]+=/d; /^START_BLOCK=/d' "$ENV_FILE"

          {
            echo ""
            echo "# Auto-generated by deploy-contracts.yml"
            grep -E '^(CONTRACT_[A-Z_]+|START_BLOCK)=' .deployments.env
          } >> "$ENV_FILE"

          echo "Updated $ENV_FILE with:"
          grep -E '^(CONTRACT_[A-Z_]+|START_BLOCK)=' .deployments.env | sed -E 's/=.*/=<set>/'

      - name: Commit synced addresses and ABIs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/src/constants/contractsV4.ts
          git add packages/ponder/abis/v4/
          if git diff --cached --quiet; then
            echo "No address/ABI changes to commit"
          else
            git commit -m "chore(contracts): sync ${{ inputs.network }} deployment addresses and ABIs"
            git push
          fi

      - name: Dump logs on failure
        if: failure()
        working-directory: packages/contract
        run: cat ignition/deployments/chain-${{ env.CHAIN_ID }}/journal.json 2>/dev/null || true
